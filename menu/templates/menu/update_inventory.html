{% extends 'base.html' %}

{% block title %}Update {{ item.name }}{% endblock %}

{% block content %}

<div class="row justify-content-center">
<div class="col-md-6">

<h2 class="page-title mb-4">📦 Update {{ item.name }}</h2>

<div class="card p-4">
    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="fw-bold mb-2">Current Quantity</label>
            <input type="number" class="form-control" name="quantity" 
                   value="{{ item.quantity }}" step="0.01" required>
        </div>

        <div class="mb-3">
            <label class="fw-bold mb-2">Price Per Unit ($)</label>
            <input type="number" class="form-control" name="price_per_unit" 
                   value="{{ item.price_per_unit }}" step="0.01" required>
        </div>

        <div class="mb-3">
            <label class="fw-bold mb-2">Item</label>
            <input type="text" class="form-control" value="{{ item.name }}" disabled>
        </div>

        <div class="mb-3">
            <label class="fw-bold mb-2">Unit</label>
            <input type="text" class="form-control" value="{{ item.unit }}" disabled>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1">
                Update ✅
            </button>
            <a href="/inventory/" class="btn btn-dark">Cancel</a>
        </div>
    </form>
</div>

</div>
</div>

{% endblock %}
