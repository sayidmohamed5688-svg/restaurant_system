{% extends 'base.html' %}

{% block title %}Add Inventory Item{% endblock %}

{% block content %}

<div class="row justify-content-center">
<div class="col-md-6">

<h2 class="page-title mb-4">📦 Add Inventory Item</h2>

<div class="card p-4">
    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="fw-bold mb-2">Item Name</label>
            <input type="text" class="form-control" name="name" placeholder="e.g. Rice, Meat, Oil" required>
        </div>

        <div class="mb-3">
            <label class="fw-bold mb-2">Unit</label>
            <select class="form-select" name="unit">
                <option value="kg">Kilogram (kg)</option>
                <option value="g">Gram (g)</option>
                <option value="L">Liter (L)</option>
                <option value="ml">Milliliter (ml)</option>
                <option value="piece">Piece</option>
                <option value="box">Box</option>
                <option value="bag">Bag</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="fw-bold mb-2">Quantity</label>
            <input type="number" class="form-control" name="quantity" placeholder="0" step="0.01" required>
        </div>

        <div class="mb-3">
            <label class="fw-bold mb-2">Price Per Unit ($)</label>
            <input type="number" class="form-control" name="price_per_unit" placeholder="0.00" step="0.01" required>
        </div>

        <div class="mb-3">
            <label class="fw-bold mb-2">Low Stock Alert (when to warn)</label>
            <input type="number" class="form-control" name="low_stock_alert" placeholder="5" step="0.01">
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1">
                Save Item 💾
            </button>
            <a href="/inventory/" class="btn btn-dark">Cancel</a>
        </div>
    </form>
</div>

</div>
</div>

{% endblock %}
