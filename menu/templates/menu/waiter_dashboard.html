{% extends 'base.html' %}

{% block title %}Waiter Dashboard{% endblock %}

{% block content %}

<h2 class="mb-4 text-center">👋 Select Your Name</h2>

<div class="row justify-content-center">
{% for waiter in waiters %}
<div class="col-md-4 mb-3">
    <a href="/waiter/{{ waiter.username }}/" class="text-decoration-none">
        <div class="card text-center p-4 hover-card">
            <h1>👤</h1>
            <h4>{{ waiter.username }}</h4>
            <p class="text-muted">Click to see your tables</p>
        </div>
    </a>
</div>
{% endfor %}
</div>

{% endblock %}
